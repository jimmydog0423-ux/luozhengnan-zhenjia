<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09080d">
  <title>羅正男：宿舍失蹤事件</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="shell">
    <canvas id="game" width="1600" height="900" aria-label="羅正男：宿舍失蹤事件"></canvas>
    <div class="scanlines"></div>
    <div class="grain"></div>

    <div id="titleOverlay" class="overlay show">
      <div class="title-card">
        <div class="kicker">《羅正男：真假》CASE 01</div>
        <h1>宿舍失蹤事件</h1>
        <p>一個人不見了。每個人都記得自己看過他，但時間對不起來。</p>
        <div class="controls">
          <span>WASD / 方向鍵：移動</span>
          <span>E：調查／對話</span>
          <span>Shift：快走</span>
          <span>Q：案件筆記</span>
          <span>F：手電筒</span>
          <span>Esc：暫停／返回</span>
        </div>
        <button id="startBtn">進入起圈宿舍</button>
        <small>虛構作品。人物、組織與事件均經合成及戲劇化改編。</small>
      </div>
    </div>

    <div id="pauseOverlay" class="overlay">
      <div class="small-card">
        <div class="kicker">PAUSED</div>
        <h2>聊天室還在跑。</h2>
        <button id="resumeBtn">繼續</button>
        <button id="restartBtn">重新開始案件</button>
      </div>
    </div>

    <div id="endingOverlay" class="overlay">
      <div class="title-card">
        <div class="kicker">CASE CLOSED?</div>
        <h1 id="endingTitle">真假。</h1>
        <p id="endingText"></p>
        <div id="endingStats" class="ending-stats"></div>
        <button id="againBtn">重新調查</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
