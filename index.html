<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07070b">
  <title>羅正男：紅色學校</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <canvas id="game" width="1600" height="900"></canvas>
    <div class="crt"></div>
    <div class="grain"></div>

    <div id="titleOverlay" class="overlay show">
      <div class="title-card">
        <div class="eyebrow">《羅正男：真假》CASE 02</div>
        <h1>紅色學校</h1>
        <p>午夜之後，這所廢棄學校會多出一層樓。問題是，沒有人記得那一層原本是做什麼的。</p>
        <div class="keys">
          <span>WASD / 方向鍵：移動</span>
          <span>E：調查／對話</span>
          <span>Shift：快走</span>
          <span>M：校園地圖／快速移動</span>
          <span>Q：案件筆記</span>
          <span>Esc：返回／暫停</span>
        </div>
        <button id="startBtn">進入紅色學校</button>
        <small>本作為虛構超自然喜劇。角色與實況文化為戲劇化創作；靈異、控制、Boss 等內容不代表對現實人物的事實陳述。</small>
      </div>
    </div>

    <div id="pauseOverlay" class="overlay">
      <div class="small-card">
        <div class="eyebrow">PAUSED</div>
        <h2>薛喜：你真的要在這裡發呆？</h2>
        <button id="resumeBtn">繼續</button>
        <button id="restartBtn">重新開始</button>
      </div>
    </div>

    <div id="endingOverlay" class="overlay">
      <div class="title-card">
        <div class="eyebrow">ENDING</div>
        <h1 id="endingTitle"></h1>
        <p id="endingText"></p>
        <div id="endingStats" class="ending-stats"></div>
        <button id="againBtn">重新調查</button>
      </div>
    </div>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
