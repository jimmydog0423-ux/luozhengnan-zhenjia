<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09080d">
  <title>羅正男：紅色學校</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/rework.css">
  <link rel="stylesheet" href="css/minigame-rework.css">
</head>
<body>
  <main id="app">
    <section id="scene" aria-label="遊戲場景">
      <svg id="roomArt" class="room-art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <use id="roomArtUse" href="assets/art.svg#room-gate" width="1600" height="900"></use>
      </svg>
      <div id="objectLayer" class="object-layer"></div>
      <div class="scene-shade"></div>

      <header class="hud">
        <div>
          <div id="roomName" class="room-name">校門</div>
          <div id="roomSub" class="room-sub">紅色學校・正門</div>
        </div>
        <div class="hud-stats">
          <span>線索 <b id="clueCount">0</b>/13</span>
          <span>協助 <b id="winCount">0</b></span>
          <span>本房調查 <b id="roomProgress">0/0</b></span>
        </div>
      </header>

      <aside class="objective-panel" aria-live="polite">
        <div class="objective-kicker">目前目標</div>
        <div id="objectiveText" class="objective-text">進入校園，確認第八扇窗的傳聞。</div>
      </aside>

      <nav class="toolbar" aria-label="遊戲選單">
        <button id="hintBtn" type="button" aria-pressed="false">顯示互動點</button>
        <button id="mapBtn" type="button">校園地圖</button>
        <button id="notesBtn" type="button">案件筆記</button>
        <button id="pauseBtn" type="button">暫停</button>
      </nav>

      <div id="messageBox" class="message-box" role="status" aria-live="polite"></div>
    </section>

    <div id="titleOverlay" class="overlay show">
      <div class="card title-card">
        <div class="eyebrow">《羅正男：真假》CASE 02</div>
        <h1>紅色學校</h1>
        <p>午夜之後，這所廢棄學校會多出一層樓。你不需要控制角色走路：直接點房間裡的門、人物與物件調查。</p>
        <div class="control-note">全程滑鼠／觸控操作。沒有 WASD，也不需要走到物件旁邊。</div>
        <div class="title-actions">
          <button id="startBtn" class="primary" type="button">新的調查</button>
          <button id="continueBtn" type="button" hidden>繼續上次調查</button>
        </div>
        <small>本作為虛構超自然喜劇。角色、Boss 與情節均為戲劇化創作。</small>
      </div>
    </div>

    <div id="modalOverlay" class="overlay" aria-hidden="true">
      <div id="modalCard" class="card modal-card">
        <button id="modalClose" class="icon-close" type="button" aria-label="關閉">×</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <div id="pauseOverlay" class="overlay">
      <div class="card small-card">
        <div class="eyebrow">PAUSED</div>
        <h2>薛喜：你真的要在這裡發呆？</h2>
        <p id="saveStatus" class="save-status">進度會在移動房間、取得線索與完成挑戰後自動儲存。</p>
        <button id="resumeBtn" class="primary" type="button">繼續</button>
        <button id="restartBtn" type="button">重新開始</button>
      </div>
    </div>

    <div id="endingOverlay" class="overlay">
      <div class="card title-card">
        <div class="eyebrow">ENDING</div>
        <h1 id="endingTitle"></h1>
        <p id="endingText"></p>
        <div id="endingStats" class="ending-stats"></div>
        <button id="againBtn" class="primary" type="button">重新調查</button>
      </div>
    </div>
  </main>
  <script src="js/game.js"></script>
  <script src="js/backgrounds.js"></script>
  <script src="js/rework.js"></script>
  <script src="js/minigame-rework.js"></script>
</body>
</html>
